name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Provide minimal env so the build doesn't fail on missing keys.
      # Real values come from Vercel env at runtime; these are just placeholders
      # for the build step which doesn't actually call APIs.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      SUPABASE_SECRET_KEY: sb_secret_placeholder
      OPENAI_API_KEY: sk-placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      NEXT_PUBLIC_APP_NAME: AVA
      NEXT_PUBLIC_DEFAULT_GREETING: Lou

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true # don't block on lint warnings, just surface them

      - name: Build
        run: pnpm build
