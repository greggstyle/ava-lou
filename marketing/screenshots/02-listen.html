<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>AVA — Listen</title>
<link rel="stylesheet" href="_shared.css">
</head>
<body>
  <div class="frame">
    <div class="marketing">
      <span class="label ink">Voice flow</span>
      <h1>Parlez, <em>AVA écoute</em>.</h1>
      <p>« Facture pour M. Payet, 3 heures à 55 € TVA 8,5 % » suffit à créer un brouillon complet.</p>
    </div>
    <div class="phone">
      <div class="screen dark">
        <div class="statusbar"><span>9:41</span><span>●●●●</span></div>
        <div class="scr" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 80px;">
          <div class="waveform" style="margin-bottom: 100px;">
            <span style="height: 60%"></span>
            <span style="height: 90%"></span>
            <span style="height: 75%"></span>
            <span style="height: 100%"></span>
            <span style="height: 70%"></span>
            <span style="height: 90%"></span>
            <span style="height: 55%"></span>
            <span style="height: 80%"></span>
            <span style="height: 65%"></span>
            <span style="height: 95%"></span>
            <span style="height: 70%"></span>
            <span style="height: 85%"></span>
            <span style="height: 60%"></span>
            <span style="height: 75%"></span>
            <span style="height: 50%"></span>
          </div>
          <div style="font: 400 96px/1 var(--serif); color: var(--paper); font-feature-settings: 'tnum' 1;">0:08</div>
          <div style="font: 500 28px/1 var(--sans); color: rgba(255,255,255,0.7); margin-top: 30px; letter-spacing: 1px;">AVA écoute…</div>
          <div class="disclaim" style="margin-top: 80px; max-width: 600px;">
            <div class="dot"></div>
            <div><em>Brouillon</em> — rien n'est envoyé sans votre accord.</div>
          </div>
        </div>
        <div style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);">
          <div class="btn green" style="font-size: 36px; padding: 36px 80px; border-radius: 36px;">Stop & traiter</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
